# ============================================================
#  SecretPowers configuration
#  Times are in seconds unless noted. Run /sp admin reload
#  after editing (some changes apply on next restart).
# ============================================================

event:
  # Length of the preparation phase.
  preparation-minutes: 20
  # Seconds of "final countdown" (Phase B) before the SMP starts.
  final-countdown-seconds: 10
  # Minutes-remaining marks at which a public countdown is shown.
  announce-at-minutes: [20, 10, 5, 1]
  # During the final countdown, announce at these seconds remaining.
  final-announce-at-seconds: [10, 5, 3, 2, 1]

preparation:
  # Is PvP allowed during preparation? (Spec default: no)
  pvp-enabled: false

assignment:
  # false = unique powers while enough are unassigned.
  # true  = always allow duplicates.
  allow-duplicates: false
  # Players who join during preparation or later receive a power
  # once and keep it forever (never rerolled by relogging).
  assign-late-joiners: true

activation:
  # The key item used to trigger your power (right-click).
  item-material: NETHER_STAR
  item-name: "<gradient:#ffd700:#b8860b>Power Core</gradient>"
  # Give the item back automatically after death/respawn.
  return-on-respawn: true
  # Slot to place the item in when given (0-8 = hotbar).
  preferred-slot: 8
  # Private cooldown message style: ACTIONBAR or CHAT.
  cooldown-feedback: ACTIONBAR
  # Min seconds between "on cooldown" messages (anti-spam).
  feedback-throttle-seconds: 2

teams:
  max-size: 4
  allow-player-invites: true
  invite-expire-seconds: 60

announcements:
  # Whether to broadcast phase changes to everyone.
  broadcast-phase-changes: true
  # NEVER enable power names in public messages; there is no option.

powers:
  phantom:
    enabled: true
    cooldown: 20
    max-range: 8.0
  juggernaut:
    enabled: true
    cooldown: 60
    duration: 5
    resistance-amplifier: 1   # 0 = Resistance I, 1 = Resistance II
    slowness-amplifier: 1
  stormcaller:
    enabled: true
    cooldown: 45
    range: 15.0
    deal-damage: true         # lightning damage to entities
    set-fire: false           # environmental fire from strike
  ghost:
    enabled: true
    cooldown: 60
    duration: 5
    hide-held-items: true     # hide hand items from other players
    hide-armor: true
  lifebinder:
    enabled: true
    cooldown: 30
    heal-amount: 4.0          # health points (2 = one heart)
    range: 6.0
    require-line-of-sight: true
    heal-self-if-no-teammate: true
  skybound:
    enabled: true
    cooldown: 25
    upward-velocity: 1.4
    max-velocity: 2.0         # hard safety cap
  soulthief:
    enabled: true
    cooldown: 10              # internal anti-spam between steals
    max-levels-stolen: 3
  frostbite:
    enabled: true
    cooldown: 30
    duration: 3
    range: 8.0
    slowness-amplifier: 2
  inferno:
    enabled: true
    cooldown: 45
    duration: 5
    aura-radius: 3.0
    burn-enemies: true
    burn-seconds: 3
  forcewave:
    enabled: true
    cooldown: 25
    range: 5.0
    strength: 1.2
    max-velocity: 2.0

debug:
  # Logs to console ONLY. Never logs secret power names publicly.
  enabled: false
